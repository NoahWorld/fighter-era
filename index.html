<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="简单的在线字数统计工具，实时统计总字符、去空白字符和行数，文字仅在浏览器内处理。">
    <title>字数统计 · 文字小工具</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        color: #24302d;
        background: #f5f7f6;
      }

      * { box-sizing: border-box; }
      body { margin: 0; }
      main { width: min(100% - 40px, 760px); margin: 64px auto 32px; }
      .eyebrow { margin: 0 0 12px; color: #51776a; font-size: 13px; letter-spacing: 2px; }
      h1 { margin: 0; font-size: clamp(28px, 5vw, 36px); font-weight: 650; letter-spacing: -1px; }
      .intro { margin: 12px 0 28px; color: #697570; font-size: 15px; line-height: 1.7; }
      .card { padding: 28px; background: #fff; border: 1px solid #e2e8e4; border-radius: 16px; }
      .editor-heading { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 14px; }
      label { font-size: 15px; font-weight: 600; }
      button { padding: 8px 14px; border: 1px solid #dce4df; border-radius: 8px; background: #fff; color: #426858; font: inherit; font-size: 13px; cursor: pointer; }
      button:hover:not(:disabled) { background: #eff5f1; }
      button:disabled { color: #98a39d; cursor: default; }
      textarea { display: block; width: 100%; min-height: 270px; padding: 16px; resize: vertical; border: 1px solid #dce4df; border-radius: 10px; background: #fafcfb; color: inherit; font: inherit; font-size: 16px; line-height: 1.8; }
      textarea::placeholder { color: #9aa49e; }
      textarea:focus-visible, button:focus-visible { outline: 3px solid #c0dccd; outline-offset: 3px; }
      .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 24px; }
      .stat { min-width: 0; padding: 4px 0; }
      .stat + .stat { padding-left: 24px; border-left: 1px solid #e7ece9; }
      .number { display: block; color: #315b47; font-size: clamp(24px, 4vw, 32px); font-weight: 650; line-height: 1.3; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
      .stat-label { display: block; margin-top: 8px; color: #79857e; font-size: 13px; }
      .rules { margin: 20px 0 0; color: #89928d; font-size: 12px; line-height: 1.8; }
      .privacy { margin: 22px 0 0; color: #7c8981; font-size: 13px; text-align: center; line-height: 1.8; }

      @media (max-width: 480px) {
        main { width: calc(100% - 32px); margin-top: 36px; }
        .card { padding: 20px; }
        textarea { min-height: 250px; }
        .stats { gap: 10px; }
        .stat + .stat { padding-left: 12px; }
        .stat-label { font-size: 12px; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">文字小工具</p>
        <h1>字数统计</h1>
        <p class="intro">输入或粘贴文字，立即查看字符数量。</p>
      </header>

      <section class="card" aria-label="字数统计工具">
        <div class="editor-heading">
          <label for="text-input">待统计文字</label>
          <button id="clear-button" type="button" disabled>清空</button>
        </div>
        <textarea id="text-input" placeholder="在这里输入或粘贴文字……" aria-describedby="count-rules" spellcheck="false"></textarea>

        <div class="stats" role="status" aria-live="polite" aria-atomic="true">
          <div class="stat">
            <output id="total-count" class="number" for="text-input">0</output>
            <span class="stat-label">总字符</span>
          </div>
          <div class="stat">
            <output id="compact-count" class="number" for="text-input">0</output>
            <span class="stat-label">去空白字符</span>
          </div>
          <div class="stat">
            <output id="line-count" class="number" for="text-input">0</output>
            <span class="stat-label">行数</span>
          </div>
        </div>

        <p id="count-rules" class="rules">总字符包含空格、制表符和换行；去空白字符排除这些空白。字符按 Unicode 码点计数，组合表情可能包含多个码点。行数按换行统计，自动折行不计，空文本为 0 行。</p>
      </section>

      <p class="privacy">文字仅在当前浏览器处理，不会上传或保存。</p>
    </main>

    <script>
      'use strict';

      const textInput = document.getElementById('text-input');
      const clearButton = document.getElementById('clear-button');
      const totalCount = document.getElementById('total-count');
      const compactCount = document.getElementById('compact-count');
      const lineCount = document.getElementById('line-count');

      function updateCounts() {
        const text = textInput.value;
        totalCount.value = String(Array.from(text).length);
        compactCount.value = String(Array.from(text.replace(/\s/gu, '')).length);
        lineCount.value = String(text.length === 0 ? 0 : text.split(/\r\n|\r|\n/u).length);
        clearButton.disabled = text.length === 0;
      }

      textInput.addEventListener('input', updateCounts);
      clearButton.addEventListener('click', () => {
        textInput.value = '';
        updateCounts();
        textInput.focus();
      });

      updateCounts();
    </script>
  </body>
</html>
